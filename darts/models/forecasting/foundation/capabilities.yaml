# Foundation Model Capabilities Registry
# Hierarchical structure: family → subfamily → variants

chronos:
  description: "Amazon Chronos family of time series foundation models"
  subfamilies:
    chronos-2:
      description: "Chronos 2.0 - Universal forecasting (univariate, multivariate, covariate-informed)"
      model_id: "amazon/chronos-2"
      # Capabilities
      multivariate: true
      probabilistic: true
      # Hard architectural limits (read-only constants)
      max_context_length: 8192        # pipeline.model_context_length
      max_forecast_horizon: 1024       # max_output_patches (64) × patch_size (16)
      patch_size: 16                   # pipeline.model_output_patch_size
      default_context_length: 2048     # pipeline.default_context_length
      # Legacy fields (deprecated, kept for backward compatibility)
      context_length: 512              # DEPRECATED: use default_context_length
      prediction_length: 64            # DEPRECATED: use max_forecast_horizon

timesfm:
  description: "Google TimesFM (Time Series Foundation Model)"
  subfamilies:
    timesfm-2.5:
      description: "TimesFM 2.5 - Latest generation with 16k context support"
      model_id: "google/timesfm-2.5-200m-pytorch"
      # Capabilities
      multivariate: false
      probabilistic: true
      # Hard architectural limits (read-only constants)
      max_context_length: 16384        # GitHub README: "supports up to 16k context"
      max_forecast_horizon: 256        # timesfm.py line 190
      patch_size: 32                   # timesfm.py line 122 validation
      default_context_length: 1024     # HuggingFace examples
